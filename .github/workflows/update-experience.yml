name: Update experience

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Calculate years since 2023-03-14 and update README
        run: |
          YEARS=$(python3 -c "from datetime import date; print(f'{(date.today() - date(2023, 3, 14)).days / 365.25:.1f}')")
          sed -i -E "s/[0-9]+\.[0-9]\+ years/${YEARS}+ years/g" README.md
          sed -i -E "s/[0-9]+\.[0-9]%2B\+years/${YEARS}%2B+years/g" README.md

      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "Akib Rayhan"
            git config user.email "kaziakibrayhan2018@gmail.com"
            git add README.md
            git commit -m "chore: update experience"
            git push
          fi
